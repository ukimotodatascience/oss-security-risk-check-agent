name: On-demand OSS Security Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target GitHub Repository URL (e.g., https://github.com/owner/repo)'
        required: true
        type: string
      target_ref:
        description: 'Target Branch / Tag / Commit (optional)'
        required: false
        type: string
        default: ''
      target_subdir:
        description: 'Target Subdirectory (optional)'
        required: false
        type: string
        default: ''

concurrency:
  group: scan-workflow-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    name: Run OSS Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0d713683868197791244f772413e110757d54e43 # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Trivy scanner
        uses: aquasecurity/setup-trivy@b4737d2f9b8c0a87a2a07c42738416d860d5ed70 # v0.2.2 SHA pinned
        with:
          version: 'v0.58.2'

      - name: Install Scorecard CLI
        run: |
          SCORECARD_VERSION="v4.13.1"
          EXPECTED_SHA256="53aa07786f2d985d0755ff9caad4e38c0a22596708de0728c5274f84ae48f785"
          curl -sSL "https://github.com/ossf/scorecard/releases/download/${SCORECARD_VERSION}/scorecard_4.13.1_linux_amd64.tar.gz" -o scorecard.tar.gz
          echo "${EXPECTED_SHA256}  scorecard.tar.gz" | sha256sum -c -
          tar -xzf scorecard.tar.gz
          sudo mv scorecard /usr/local/bin/scorecard
          sudo chmod +x /usr/local/bin/scorecard
          scorecard version || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi

      - name: Run MVP Scan
        env:
          TARGET_URL: ${{ inputs.target_url }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_SUBDIR: ${{ inputs.target_subdir }}
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c '
          import os, subprocess, sys
          url = os.environ.get("TARGET_URL", "").strip()
          ref = os.environ.get("TARGET_REF", "").strip()
          subdir = os.environ.get("TARGET_SUBDIR", "").strip()
          cmd = [sys.executable, "main.py", url, "--mvp", "--output-dir", "docs/"]
          if ref:
              cmd.extend(["--ref", ref])
          if subdir:
              cmd.extend(["--subdir", subdir])
          print(f"Running command: {cmd}")
          subprocess.run(cmd, check=True)
          '

      - name: Commit and push scan results
        uses: stefanzweifel/git-auto-commit-action@e592800268700f57bdc76e05f6a2bc70350a6007 # v5.0.0 SHA pinned
        with:
          commit_message: 'chore(scan): update scan_result.json via workflow_dispatch'
          file_pattern: 'docs/scan_result.json'

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffbe0e8f2d5469feb88d8 # v3.0.1
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
