name: On-demand OSS Security Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target GitHub Repository URL (e.g., https://github.com/owner/repo)'
        required: true
        type: string
      target_ref:
        description: 'Target Branch / Tag / Commit (optional)'
        required: false
        type: string
        default: ''
      target_subdir:
        description: 'Target Subdirectory (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  scan:
    name: Run OSS Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi

      - name: Run MVP Scan
        run: |
          CMD="python main.py \"${{ inputs.target_url }}\" --mvp --output-dir docs/"
          if [ -n "${{ inputs.target_ref }}" ]; then
            CMD="$CMD --ref \"${{ inputs.target_ref }}\""
          fi
          if [ -n "${{ inputs.target_subdir }}" ]; then
            CMD="$CMD --subdir \"${{ inputs.target_subdir }}\""
          fi
          eval $CMD

      - name: Commit and push scan results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(scan): update scan_result.json via workflow_dispatch'
          file_pattern: 'docs/scan_result.json'
