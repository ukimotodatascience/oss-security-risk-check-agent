name: On-demand OSS Security Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target GitHub Repository URL (e.g., https://github.com/owner/repo)'
        required: true
        type: string
      target_ref:
        description: 'Target Branch / Tag / Commit (optional)'
        required: false
        type: string
        default: ''
      target_subdir:
        description: 'Target Subdirectory (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  scan:
    name: Run OSS Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0d713683868197791244f772413e110757d54e43 # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Trivy scanner
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          version: 'latest'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi

      - name: Run MVP Scan
        env:
          TARGET_URL: ${{ inputs.target_url }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_SUBDIR: ${{ inputs.target_subdir }}
        run: |
          python -c '
          import os, subprocess, sys
          url = os.environ.get("TARGET_URL", "").strip()
          ref = os.environ.get("TARGET_REF", "").strip()
          subdir = os.environ.get("TARGET_SUBDIR", "").strip()
          cmd = [sys.executable, "main.py", url, "--mvp", "--output-dir", "docs/"]
          if ref:
              cmd.extend(["--ref", ref])
          if subdir:
              cmd.extend(["--subdir", subdir])
          print(f"Running command: {cmd}")
          subprocess.run(cmd, check=True)
          '

      - name: Commit and push scan results
        uses: stefanzweifel/git-auto-commit-action@e592800268700f57bdc76e05f6a2bc70350a6007 # v5.0.0
        with:
          commit_message: 'chore(scan): update scan_result.json via workflow_dispatch'
          file_pattern: 'docs/scan_result.json'
